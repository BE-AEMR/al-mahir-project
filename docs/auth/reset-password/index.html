<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Mahir - Réinitialisation de mot de passe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      background-color: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 90%;
    }
    h1 {
      color: #1F4E5F;
      margin-bottom: 1rem;
    }
    p {
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top: 4px solid #1F4E5F;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .button {
      background-color: #1F4E5F;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      display: none;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Réinitialisation de mot de passe</h1>
    <div class="spinner"></div>
    <p>Vous êtes en train d'être redirigé vers l'application Al Mahir pour réinitialiser votre mot de passe.</p>
    <p id="countdown">Si la redirection automatique ne fonctionne pas dans <span id="timer">5</span> secondes, veuillez cliquer sur le bouton ci-dessous.</p>
    <a href="#" id="manual-redirect" class="button">Ouvrir l'application</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Extraire les paramètres de l'URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token') || '';
      const type = urlParams.get('type') || '';
      
      // Construire l'URL de redirection vers l'application mobile
      let redirectUrl = 'almahir://reset-password';
      
      // Ajouter les paramètres nécessaires
      if (token) {
        redirectUrl += `?code=${token}`;
        if (type) {
          redirectUrl += `&type=${type}`;
        }
      }
      
      // Configurer le bouton de redirection manuelle
      const manualRedirectBtn = document.getElementById('manual-redirect');
      manualRedirectBtn.href = redirectUrl;
      
      // Ajouter un gestionnaire d'événements pour le bouton
      manualRedirectBtn.addEventListener('click', function(e) {
        // Empêcher le comportement par défaut du lien
        e.preventDefault();
        
        // Essayer d'ouvrir l'application via le deeplink
        window.location.href = redirectUrl;
        
        // Après un court délai, vérifier si l'application s'est ouverte
        // Si non, afficher un message
        setTimeout(function() {
          alert("Si l'application ne s'ouvre pas automatiquement, assurez-vous que l'application Al Mahir est installée sur votre appareil et que vous utilisez un navigateur mobile compatible avec les deeplinks.");
        }, 2000);
      });
      
      // Compte à rebours pour afficher le bouton
      let countdown = 5;
      const timer = document.getElementById('timer');
      const countdownInterval = setInterval(function() {
        countdown--;
        timer.textContent = countdown;
        
        if (countdown <= 0) {
          clearInterval(countdownInterval);
          manualRedirectBtn.style.display = 'inline-block';
        }
      }, 1000);
      
      // Tentative de redirection automatique
      setTimeout(function() {
        window.location.href = redirectUrl;
      }, 1500);
    });
  </script>
</body>
</html>
